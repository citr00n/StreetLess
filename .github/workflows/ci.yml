name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Test Go server
        working-directory: server
        run: |
          go test ./...
          go vet ./...
      - name: Test client wire and pairing codecs
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Iclient/include client/source/wire.c client/tests/wire_test.c -o /tmp/streetless-wire-test
          /tmp/streetless-wire-test
          cc -std=c11 -Wall -Wextra -Werror -Iclient/include client/source/pair.c client/source/config.c client/tests/pair_test.c -o /tmp/streetless-pair-test
          /tmp/streetless-pair-test
      - name: Test client title selection
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Iclient/include client/source/title_names.c client/tests/title_names_test.c -o /tmp/streetless-title-test
          /tmp/streetless-title-test
          cc -std=c11 -Wall -Wextra -Werror -DSTREETLESS_SELECTION_HOST_TEST -Iclient/include client/source/selection.c client/tests/selection_test.c -o /tmp/streetless-selection-test
          /tmp/streetless-selection-test
          cc -std=c11 -Wall -Wextra -Werror -D_POSIX_C_SOURCE=200809L -DSTREETLESS_SELECTION_HOST_TEST -DSTREETLESS_SELECTION_STORAGE_TEST -Iclient/include client/source/selection.c client/tests/selection_storage_test.c -o /tmp/streetless-selection-storage-test
          /tmp/streetless-selection-storage-test
      - name: Test background lifecycle
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Ibackground/include background/source/lifecycle.c background/tests/lifecycle_test.c -o /tmp/streetless-bg-test
          /tmp/streetless-bg-test
      - name: Test client debug transport
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev
          cc -std=c11 -Wall -Wextra -Werror -Iclient/include client/source/http.c client/tests/http_debug_test.c -lcurl -o /tmp/streetless-http-test
          /tmp/streetless-http-test
          cc -std=c11 -Wall -Wextra -Werror -Iclient/include client/source/http.c client/tests/http_ca_blob_test.c -lcurl -o /tmp/streetless-ca-test
          python3 client/tests/http_ca_blob_test.py /tmp/streetless-ca-test
      - name: Test Compose HTTPS deployment
        shell: bash
        run: |
          set -euo pipefail
          D=$(mktemp -d "$RUNNER_TEMP/streetless.XXXXXX")
          export COMPOSE_PROJECT_NAME="streetless-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export STREETLESS_DATA="$D/data" STREETLESS_UID="$(id -u)" STREETLESS_GID="$(id -g)"
          export STREETLESS_ORIGIN=https://localhost:18443 STREETLESS_PORT=18443
          export STREETLESS_PUBLIC_IPV4=127.0.0.1 TLS_CERT="$D/cert.pem" TLS_KEY="$D/key.pem"
          mkdir "$STREETLESS_DATA"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=localhost \
            -addext subjectAltName=DNS:localhost -keyout "$TLS_KEY" -out "$TLS_CERT" >/dev/null 2>&1
          cleanup() { docker compose down; rm -rf "$D"; }
          trap cleanup EXIT
          docker compose up -d --build
          healthy=false
          for attempt in {1..20}; do
            if [ "$(curl --fail --silent --cacert "$TLS_CERT" https://localhost:18443/healthz || true)" = ok ]; then
              healthy=true
              break
            fi
            sleep 1
          done
          if [ "$healthy" != true ]; then
            docker compose logs
            exit 1
          fi
          test -f "$STREETLESS_DATA/streetless.sqlite"

  client-build:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build CIA packaging tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/streetless-tools"
          git clone https://github.com/3DSGuy/Project_CTR.git "$RUNNER_TEMP/project-ctr"
          git -C "$RUNNER_TEMP/project-ctr" checkout --detach d52c2b0e788c2d085763d7c5dcc4b2edd9ffb7d8
          make -C "$RUNNER_TEMP/project-ctr/makerom" deps
          make -C "$RUNNER_TEMP/project-ctr/makerom"
          cp "$RUNNER_TEMP/project-ctr/makerom/bin/makerom" "$RUNNER_TEMP/streetless-tools/"
          git clone https://github.com/Epicpkmn11/bannertool.git "$RUNNER_TEMP/bannertool"
          git -C "$RUNNER_TEMP/bannertool" checkout --detach 51dac927a4c43de769900d91fd3cb6142295263f
          git -C "$RUNNER_TEMP/bannertool" -c url.https://github.com/.insteadOf=git://github.com/ submodule update --init --recursive
          make -C "$RUNNER_TEMP/bannertool"
          cp "$RUNNER_TEMP/bannertool/output/linux-x86_64/bannertool" "$RUNNER_TEMP/streetless-tools/"
      - name: Build 3DS client and background module
        run: |
          docker run --rm -v "$PWD:/work" -v "$RUNNER_TEMP/streetless-tools:/streetless-tools:ro" -w /work \
            devkitpro/devkitarm@sha256:116afba8df8453961de2936ffab20dd441edf4d682856c1ec8b0e53d7ed0bbf5 \
            sh -lc 'set -e; command -v python3 >/dev/null || (apt-get update && apt-get install -y --no-install-recommends python3); dkp-pacman --noconfirm --needed -S 3ds-dev 3ds-curl 3ds-jansson; export PATH="/streetless-tools:$PATH"; make -C client; make -C background; test -s client/streetless.3dsx; test -s client/streetless.cia; test -s background/0004013000F5A302.cxi'
      - name: Upload 3DS client artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: streetless-3ds
          path: |
            client/streetless.3dsx
            client/streetless.cia
          if-no-files-found: error
      - name: Upload background module
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: streetless-background
          path: background/0004013000F5A302.cxi
          if-no-files-found: error

  release-version:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      valid: ${{ steps.version.outputs.valid }}
    steps:
      - id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]] && [ "${#GITHUB_REF_NAME}" -le 128 ]; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: [tests, client-build, release-version]
    if: needs.release-version.outputs.valid == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: streetless-3ds
          path: release
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: streetless-background
          path: release
      - name: Build container image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME}"
          docker build --tag "$image" .
      - name: Publish container image
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME}"
          docker logout ghcr.io
      - name: Generate FBI installation QR code
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qrencode
          printf 'https://github.com/%s/releases/download/%s/streetless.cia' "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" |
            qrencode -t PNG -o release/streetless-cia-qr.png
      - name: Publish client release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" release/streetless.3dsx release/streetless.cia release/0004013000F5A302.cxi release/streetless-cia-qr.png \
            --verify-tag --title "$GITHUB_REF_NAME" --generate-notes "${args[@]}"
